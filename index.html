<script>
let lang='ro';const tr=(ro,fr)=>lang==='ro'?ro:fr;
function setLang(next){lang=next;document.documentElement.lang=lang;document.querySelectorAll('[data-ro][data-fr]').forEach(el=>{el.textContent=el.dataset[lang]});document.querySelectorAll('[data-placeholder-ro][data-placeholder-fr]').forEach(el=>{el.placeholder=el.dataset['placeholder'+(lang==='ro'?'Ro':'Fr')]});document.getElementById('roBtn').setAttribute('aria-pressed',lang==='ro');document.getElementById('frBtn').setAttribute('aria-pressed',lang==='fr');}
