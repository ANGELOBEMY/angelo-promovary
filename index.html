<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angelo Promovăry — Agenție de marketing</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 10% 10%,#164cc5,transparent 45%),radial-gradient(circle at 90% 60%,#721a97,transparent 45%),#070e25}header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;background:#060c20a9;position:sticky;top:0}header strong{color:#ffdb80}button{background:#1a3164;border:1px solid #7cc5ff;color:white;border-radius:20px;padding:10px;cursor:pointer}.active{background:#ffcb6a;color:#15152b}main{max-width:1050px;margin:auto;padding:20px 5% 70px}.hero{text-align:center;padding:20px 0 35px}.hero img{width:min(350px,85%);border-radius:50%;filter:drop-shadow(0 0 25px #007bff99)}h1{font-size:clamp(2.1rem,6vw,4rem);color:#ffe092}h2{color:#ffdb80;margin-top:50px}.lead{max-width:720px;margin:20px auto;font-size:1.2rem;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card{padding:24px;border:1px solid #ffffff45;background:#ffffff12;border-radius:20px;line-height:1.6}.card h3{color:#ffe092}footer{text-align:center;padding:25px;border-top:1px solid #ffffff40}a{color:#ffe092}</style></head><body><header><strong>✦ ANGELO PROMOVĂRY</strong><div><button id="ro" class="active">🇷🇴 RO</button> <button id="fr">🇫🇷 FR</button></div></header><main><section class="hero"><img src="emblema.png" alt="Emblema oficială Angelo Promovăry"><h1>ANGELO PROMOVĂRY</h1><p class="lead" id="intro"></p></section><section><h2 id="services"></h2><div class="grid" id="cards"></div></section><section><h2 id="prices"></h2><div class="card" id="pricing"></div></section><section><h2 id="contact"></h2><p id="contactText"></p><p><a href="https://github.com/ANGELOBEMY">GitHub · ANGELOBEMY</a></p></section></main><footer>© 2026 Angelo Promovăry · România 🇷🇴 & France 🇫🇷</footer><script>const t={ro:{intro:'Agenție de marketing digital și creație vizuală. Ideile tale prind viață prin imagini, identitate vizuală și promovare creativă.',services:'Serviciile noastre',prices:'Prețuri orientative',pricing:'Editare foto de la 3 € · Emblemă de la 5 € · Poster de meci de la 5 € · Creație muzicală de la 10 €. Prețul final depinde de proiect.',contact:'Contact și colaborări',contactText:'Pentru comenzi și colaborări, contactează Angelo Promovăry prin canalele sociale oficiale.',cards:[['🎨','Editare foto','Imagini personalizate și creații pentru social media.'],['🦅','Logouri și embleme','Identitate vizuală pentru creatori și comunități.'],['📣','Postere și reclame','Materiale pentru evenimente, meciuri și afaceri.'],['🎵','Creații muzicale','Melodii personalizate și concepte creative.']]},fr:{intro:'Agence de marketing digital et de création visuelle. Vos idées prennent vie grâce à des visuels et des promotions créatives.',services:'Nos services',prices:'Tarifs indicatifs',pricing:'Retouche photo dès 3 € · Emblème dès 5 € · Affiche de match dès 5 € · Création musicale dès 10 €. Prix final selon le projet.',contact:'Contact et collaborations',contactText:'Pour vos commandes et collaborations, contactez Angelo Promovăry via ses réseaux sociaux officiels.',cards:[['🎨','Retouche photo','Visuels personnalisés pour les réseaux sociaux.'],['🦅','Logos et emblèmes','Identité visuelle pour créateurs et communautés.'],['📣','Affiches et publicité','Supports pour événements, matchs et entreprises.'],['🎵','Créations musicales','Chansons personnalisées et concepts créatifs.']]}};function language(l){document.documentElement.lang=l;for(const k of ['intro','services','prices','pricing','contact','contactText'])document.getElementById(k).textContent=t[l][k];document.getElementById('cards').replaceChildren(...t[l].cards.map(([e,n,d])=>{const c=document.createElement('article');c.className='card';const h=document.createElement('h3');h.textContent=e+' '+n;const p=document.createElement('p');p.textContent=d;c.append(h,p);return c}));for(const x of ['ro','fr'])document.getElementById(x).classList.toggle('active',x===l)}for(const l of ['ro','fr'])document.getElementById(l).onclick=()=>language(l);language('ro');</script></body></html>
